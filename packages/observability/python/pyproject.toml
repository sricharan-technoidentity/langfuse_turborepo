[project]
name = "repo-observability"
version = "0.1.0"
description = "Langfuse features for Python apps: tracing helpers, prompt management, scores/feedback, experiments and test helpers."
requires-python = ">=3.11"
dependencies = [
    "langfuse>=5.0.4,<5.1",
    "repo-langfuse",
]

[tool.uv.sources]
repo-langfuse = { path = "../../infra/langfuse-python", editable = true }

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["repo_observability"]
mypy_path = "src"
