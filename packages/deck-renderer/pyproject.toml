[project]
name = "repo-deck-renderer"
version = "0.2.0"
description = "Deck Forge renderer: slide JSON -> .pptx with python-pptx (deterministic)."
requires-python = ">=3.11"
dependencies = ["python-pptx==1.0.2"]

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
packages = ["repo_deck_renderer"]
mypy_path = "src"
ignore_missing_imports = true
