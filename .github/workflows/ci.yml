name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Python packages (packages/observability/python) are run by Turborepo through uv.
      - uses: astral-sh/setup-uv@v10

      - run: pnpm install --frozen-lockfile

      # Build, typecheck and test every package (TS and Python). Tests use the mock model and an
      # in-memory Langfuse exporter, so no API keys are needed.
      # With a Turborepo remote cache (TURBO_TOKEN / TURBO_TEAM), unchanged packages are skipped.
      - run: pnpm turbo run build typecheck test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
