packages:
  # Applications. apps/deck-forge is the installable Kiro Crew app (assembly package);
  # its UI and backend are separate workspace packages nested under it.
  - "apps/*"
  - "apps/deck-forge/ui"
  - "apps/deck-forge/backend"
  # Shared packages (same globs as lf_turbo).
  - "packages/*"
  - "packages/infra/*"
  - "packages/observability/*"
